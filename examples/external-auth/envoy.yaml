admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901

static_resources:
  listeners:
    - name: mcp_gateway
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: mcp_gateway
                codec_type: AUTO
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: mcp
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: mcp_demo
                            timeout: 5s
                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      # Fail closed: if the authorizer is down or times out, deny.
                      failure_mode_allow: false
                      with_request_body:
                        max_request_bytes: 65536
                        allow_partial_message: false
                      http_service:
                        server_uri:
                          uri: http://127.0.0.1:9191
                          cluster: asc_ext_authz
                          timeout: 0.5s
                        path_prefix: /ext_authz
                        authorization_request:
                          allowed_headers:
                            patterns:
                              - exact: authorization
                              - exact: content-type
                              - exact: x-asc-scenario-id
                        authorization_response:
                          allowed_upstream_headers:
                            patterns:
                              - exact: x-asc-verdict
                          allowed_client_headers:
                            patterns:
                              - exact: x-asc-verdict
                              - exact: content-type
                      status_on_error:
                        code: Forbidden
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: mcp_demo
      type: STATIC
      connect_timeout: 1s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: mcp_demo
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 8090

    - name: asc_ext_authz
      type: STATIC
      connect_timeout: 0.25s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: asc_ext_authz
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 9191
