apiVersion: v1
kind: Namespace
metadata:
  name: asc-external-auth
  labels:
    app.kubernetes.io/part-of: agent-security-contract
    app.kubernetes.io/component: external-auth-quickstart
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
  namespace: asc-external-auth
data:
  envoy.yaml: |
    admin:
      address:
        socket_address:
          address: 127.0.0.1
          port_value: 9901

    static_resources:
      listeners:
        - name: mcp_gateway
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 8080
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: mcp_gateway
                    codec_type: AUTO
                    route_config:
                      name: local_route
                      virtual_hosts:
                        - name: mcp
                          domains: ["*"]
                          routes:
                            - match:
                                prefix: "/"
                              route:
                                cluster: mcp_demo
                                timeout: 5s
                    http_filters:
                      - name: envoy.filters.http.ext_authz
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                          transport_api_version: V3
                          failure_mode_allow: false
                          with_request_body:
                            max_request_bytes: 65536
                            allow_partial_message: false
                          http_service:
                            server_uri:
                              uri: http://127.0.0.1:9191
                              cluster: asc_ext_authz
                              timeout: 0.5s
                            path_prefix: /ext_authz
                            authorization_request:
                              allowed_headers:
                                patterns:
                                  - exact: authorization
                                  - exact: content-type
                                  - exact: x-asc-scenario-id
                            authorization_response:
                              allowed_upstream_headers:
                                patterns:
                                  - exact: x-asc-verdict
                              allowed_client_headers:
                                patterns:
                                  - exact: x-asc-verdict
                                  - exact: content-type
                          status_on_error:
                            code: Forbidden
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:
        - name: mcp_demo
          type: STATIC
          connect_timeout: 1s
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: mcp_demo
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 127.0.0.1
                          port_value: 8090

        - name: asc_ext_authz
          type: STATIC
          connect_timeout: 0.25s
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: asc_ext_authz
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 127.0.0.1
                          port_value: 9191
---
# Single pod: Envoy ext_authz + ASC decision API + MCP demo on localhost.
# Avoids ClusterIP/DNS so the quickstart still works when kube-proxy/nftables
# cannot program service rules (seen on some kind hosts).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asc-gateway
  namespace: asc-external-auth
  labels:
    app: asc-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asc-gateway
  template:
    metadata:
      labels:
        app: asc-gateway
    spec:
      containers:
        - name: asc-sidecar
          image: asc-sidecar:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8788
              name: asc
          readinessProbe:
            httpGet:
              path: /healthz
              port: asc
            initialDelaySeconds: 1
            periodSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

        - name: asc-ext-authz
          image: asc-ext-authz:local
          imagePullPolicy: Never
          env:
            - name: ASC_EVALUATE_URL
              value: http://127.0.0.1:8788/v1/evaluate
            - name: ASC_TIMEOUT_S
              value: "0.5"
            - name: ASC_DEMO_BEARER
              value: asc-demo
            - name: ASC_FORCE_SLEEP_S_TEST
              value: "0"
          ports:
            - containerPort: 9191
              name: authz
          readinessProbe:
            httpGet:
              path: /healthz
              port: authz
            initialDelaySeconds: 1
            periodSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi

        - name: mcp-demo
          image: asc-mcp-demo:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8090
              name: mcp
          readinessProbe:
            httpGet:
              path: /healthz
              port: mcp
            initialDelaySeconds: 1
            periodSeconds: 2
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

        - name: envoy
          image: envoyproxy/envoy:v1.31.5
          imagePullPolicy: IfNotPresent
          args:
            - "-c"
            - "/etc/envoy/envoy.yaml"
            - "--log-level"
            - info
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/envoy
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: envoy-config
