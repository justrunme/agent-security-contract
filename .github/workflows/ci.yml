name: CI

on:
  push:
    branches: [main, feat/mvp-contract, feat/external-auth-quickstart]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test-corpus:
    name: Lint, unit tests, corpus evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Collect tests (clean-install gate)
        run: |
          python -m pytest --collect-only -q
          python -c "import importlib, sys; sys.modules.pop('asc.__main__', None); importlib.import_module('asc.__main__')"

      - name: Lint
        run: python -m ruff check src tests

      - name: Unit tests (includes fail-closed negatives)
        run: python -m pytest -q

      - name: Run full corpus and generate evidence
        env:
          # Prefer PR head SHA over the pull_request merge ref (GITHUB_SHA).
          ASC_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m asc corpus \
            --policy policy/demo-agent.policy.yaml \
            --corpus corpus/scenarios \
            --results results/results.json \
            --summary results/summary.md \
            --evidence docs/EVIDENCE.md

      - name: Guard critical false-ALLOW is zero
        run: |
          python - <<'PY'
          import json, sys
          report = json.loads(open("results/results.json", encoding="utf-8").read())
          cfa = report["metrics"]["critical_false_allow"]
          print(f"critical_false_allow={cfa}")
          print(f"benign_false_block_rate={report['metrics']['benign_false_block_rate']:.4f}")
          print(f"suite_time_ms={report['suite_time_ms']}")
          if cfa != 0:
              sys.exit("critical false-ALLOW must be 0")
          if not report["passed"]:
              sys.exit("corpus did not pass")
          PY

      - name: Upload corpus artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asc-corpus-results
          path: |
            results/results.json
            results/summary.md
            docs/EVIDENCE.md

  action-self-test:
    name: Reusable action self-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Corpus via action
        uses: ./
        with:
          policy: policy/demo-agent.policy.yaml
          corpus: corpus/scenarios
          results: /tmp/asc/results.json
          summary: /tmp/asc/summary.md

      - name: Benign trace via action is ALLOW
        uses: ./
        with:
          policy: policy/demo-agent.policy.yaml
          trace: corpus/scenarios/benign_read_workspace_file.json

      - name: Attack trace via action must fail the step
        id: attack
        continue-on-error: true
        uses: ./
        with:
          policy: policy/demo-agent.policy.yaml
          trace: corpus/scenarios/unknown_tool_call.json

      - name: Injection-shaped input is treated as data, not shell
        id: inject
        continue-on-error: true
        uses: ./
        with:
          policy: 'policy/demo-agent.policy.yaml"; touch /tmp/asc-pwned; echo "'
          trace: corpus/scenarios/benign_read_workspace_file.json

      - name: Assert action outcomes
        env:
          ATTACK_OUTCOME: ${{ steps.attack.outcome }}
          INJECT_OUTCOME: ${{ steps.inject.outcome }}
        run: |
          set -euo pipefail
          test -s /tmp/asc/results.json
          python3 -c "import json,sys; r=json.load(open('/tmp/asc/results.json')); sys.exit(0 if r['passed'] and r['metrics']['critical_false_allow']==0 else 1)"
          test "${ATTACK_OUTCOME}" = "failure"
          test "${INJECT_OUTCOME}" = "failure"
          test ! -e /tmp/asc-pwned

  external-auth-quickstart:
    name: External-auth kind quickstart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Install kind and kubectl
        run: |
          set -euo pipefail
          curl -fsSL "https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64" -o /tmp/kind
          sudo install /tmp/kind /usr/local/bin/kind
          KVER="$(curl -fsSL https://dl.k8s.io/release/stable.txt)"
          curl -fsSL "https://dl.k8s.io/release/${KVER}/bin/linux/amd64/kubectl" -o /tmp/kubectl
          sudo install /tmp/kubectl /usr/local/bin/kubectl
          kind version
          kubectl version --client

      - name: Bring up kind stack
        run: |
          set -euo pipefail
          chmod +x examples/external-auth/run-kind.sh
          ./examples/external-auth/run-kind.sh | tee /tmp/asc-external-auth-url.txt
          url="$(tail -n1 /tmp/asc-external-auth-url.txt)"
          echo "ASC_EXTERNAL_AUTH_URL=${url}" >> "$GITHUB_ENV"
          echo "Using ASC_EXTERNAL_AUTH_URL=${url}"

      - name: Integration tests through Envoy (real ASC)
        env:
          ASC_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python examples/external-auth/run_integration_tests.py \
            --results results/external-auth-results.json \
            --summary results/external-auth-summary.md \
            --evidence docs/EVIDENCE-EXTERNAL-AUTH.md

      - name: Guard external-auth corpus
        run: |
          python - <<'PY'
          import json, sys
          report = json.loads(open("results/external-auth-results.json", encoding="utf-8").read())
          print(json.dumps(report["metrics"], indent=2, sort_keys=True))
          if report["metrics"]["critical_false_allow"] != 0:
              sys.exit("critical false-ALLOW must be 0")
          if not report["passed"]:
              sys.exit("external-auth corpus did not pass")
          scope = report["metrics"]["claims_scope"]
          if "on this corpus" not in scope:
              sys.exit(f"claims_scope must say on this corpus, got {scope!r}")
          PY

      - name: Upload external-auth artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asc-external-auth-results
          path: |
            results/external-auth-results.json
            results/external-auth-summary.md
            docs/EVIDENCE-EXTERNAL-AUTH.md
